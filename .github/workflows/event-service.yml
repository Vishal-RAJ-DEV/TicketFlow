name: Event Service CI

permissions:
  contents: write

on:
  pull_request:
    paths:
      - 'event-service/**'
      - 'user-service/**'
      - 'load-tests/**'
      - 'monitoring/**'
      - 'docker-compose.production.yml'
      - 'api-gateway/src/**'
      - 'api-gateway/.env.example'
      - 'shared/constants/**'
      - 'shared/utils/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'README.md'
      - 'docs/EVENT-SERVICE.md'
      - 'docs/KAFKA-EVENT-CONTRACTS.md'
      - 'docs/DATABASE-DESIGN.md'
      - 'docs/DOMAIN-MODEL.md'
      - '.github/workflows/event-service.yml'
  push:
    branches:
      - main
      - 'phase-2/**'
      - 'phase-2.1/**'
    paths:
      - 'event-service/**'
      - 'user-service/**'
      - 'load-tests/**'
      - 'monitoring/**'
      - 'docker-compose.production.yml'
      - 'api-gateway/src/**'
      - 'api-gateway/.env.example'
      - 'shared/constants/**'
      - 'shared/utils/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'README.md'
      - 'docs/EVENT-SERVICE.md'
      - 'docs/KAFKA-EVENT-CONTRACTS.md'
      - 'docs/DATABASE-DESIGN.md'
      - 'docs/DOMAIN-MODEL.md'
      - '.github/workflows/event-service.yml'

jobs:
  event-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_service_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_service_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: event-service
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_service_ci
      RUN_DATABASE_INTEGRATION: 'true'
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-that-is-at-least-32-characters
      GATEWAY_ASSERTION_SECRET: ci-only-gateway-assertion-secret-that-is-at-least-32-characters
      USER_SERVICE_INTERNAL_KEY: ci-only-user-service-internal-key-that-is-at-least-32-characters
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: event-service/package-lock.json
      - name: Refresh semver-compatible dependency lockfiles
        working-directory: .
        run: |
          for service in event-service api-gateway user-service; do
            echo "Refreshing $service lockfile without major-version overrides"
            (cd "$service" && npm audit fix --package-lock-only --ignore-scripts) || echo "Some advisories remain for $service; audit output below records them"
          done
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ../api-gateway
          npm ci --prefix ../user-service
      - name: Upload refreshed dependency lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: ticketflow-dependency-lockfiles
          path: |
            event-service/package-lock.json
            api-gateway/package-lock.json
            user-service/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Report dependency audit findings
        continue-on-error: true
        working-directory: .
        run: |
          for service in event-service api-gateway user-service; do
            echo "===== Full dependency audit: $service ====="
            (cd "$GITHUB_WORKSPACE/$service" && npm audit --json > "$RUNNER_TEMP/$service-audit.json") || true
            node - "$RUNNER_TEMP/$service-audit.json" "$service" <<'NODE'
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            console.log(process.argv[3], 'full audit:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({ name, severity: item.severity, range: item.range, isDirect: item.isDirect, fixAvailable: item.fixAvailable }));
            }
            NODE
            echo "===== Production-only dependency audit: $service ====="
            (cd "$GITHUB_WORKSPACE/$service" && npm audit --omit=dev --json > "$RUNNER_TEMP/$service-production-audit.json") || true
            node - "$RUNNER_TEMP/$service-production-audit.json" "$service" <<'NODE'
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            console.log(process.argv[3], 'production-only audit:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable }));
            }
            NODE
          done
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply PostgreSQL migrations
        run: npx prisma migrate deploy
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src test ../api-gateway/src ../shared ../user-service/src ../user-service/test -type f -name '*.js' -print)
      - name: Run Event Service unit and integration tests
        run: npm test
      - name: Run User Service internal authentication tests
        working-directory: .
        run: npm test --prefix user-service
      - name: Validate production Compose overlay
        working-directory: .
        env:
          USER_SERVICE_URL: https://user-service:4001
          SEARCH_SERVICE_URL: https://search-service:4002
          NOTIFICATION_SERVICE_URL: https://notification-service:4004
          BOOKING_SERVICE_URL: https://order-service:4005
          PAYMENT_SERVICE_URL: https://payment-service:4006
          INVENTORY_SERVICE_URL: https://inventory-service:4007
          ALLOWED_ORIGINS: https://ticketflow.example.com
          KAFKA_BROKER: kafka:9093
          KAFKA_SASL_USERNAME: event-service
          USER_SERVICE_INTERNAL_KEY_FILE: /tmp/user-key
          REDIS_URL_SECRET_FILE: /tmp/redis-url
          JWT_ACCESS_SECRET_FILE: /tmp/jwt-access
          JWT_REFRESH_SECRET_FILE: /tmp/jwt-refresh
          GATEWAY_ASSERTION_SECRET_FILE: /tmp/gateway-secret
          GATEWAY_ASSERTION_SECRET_PREVIOUS_FILE: /tmp/gateway-secret-previous
          EVENT_DATABASE_URL_SECRET_FILE: /tmp/database-url
          EVENT_SERVICE_CERT_FILE: /tmp/event-cert
          EVENT_SERVICE_KEY_FILE: /tmp/event-key
          GATEWAY_CLIENT_CA_FILE: /tmp/client-ca
          EVENT_SERVICE_CA_FILE: /tmp/event-ca
          GATEWAY_CLIENT_CERT_FILE: /tmp/gateway-cert
          GATEWAY_CLIENT_KEY_FILE: /tmp/gateway-key
          KAFKA_CA_FILE: /tmp/kafka-ca
          KAFKA_SASL_PASSWORD_FILE: /tmp/kafka-password
          EVENT_SERVICE_OPS_TOKEN_FILE: /tmp/ops-token
          EVENT_SERVICE_METRICS_TOKEN_FILE: /tmp/metrics-token
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Validate Docker Compose configuration
        working-directory: .
        env:
          GATEWAY_ASSERTION_SECRET: ci-only-gateway-secret-that-is-longer-than-32-characters
        run: docker compose config --quiet
      - name: Build Event Service image
        working-directory: .
        run: docker build -f event-service/Dockerfile -t ticketflow-event-service:ci .
      - name: Commit tested dependency lockfiles
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/phase-2.1/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add event-service/package-lock.json api-gateway/package-lock.json user-service/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already current."
            exit 0
          fi
          git commit -m "chore(deps): refresh audited dependency lockfiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"

