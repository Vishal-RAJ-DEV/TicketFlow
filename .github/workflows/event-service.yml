name: Event Service CI

on:
  pull_request:
    paths:
      - 'event-service/**'
      - 'api-gateway/src/**'
      - 'api-gateway/.env.example'
      - 'shared/constants/**'
      - 'shared/utils/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'README.md'
      - 'docs/EVENT-SERVICE.md'
      - 'docs/KAFKA-EVENT-CONTRACTS.md'
      - 'docs/DATABASE-DESIGN.md'
      - 'docs/DOMAIN-MODEL.md'
      - '.github/workflows/event-service.yml'
  push:
    branches:
      - main
      - 'phase-2/**'
      - 'phase-2.1/**'
    paths:
      - 'event-service/**'
      - 'api-gateway/src/**'
      - 'api-gateway/.env.example'
      - 'shared/constants/**'
      - 'shared/utils/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'README.md'
      - 'docs/EVENT-SERVICE.md'
      - 'docs/KAFKA-EVENT-CONTRACTS.md'
      - 'docs/DATABASE-DESIGN.md'
      - 'docs/DOMAIN-MODEL.md'
      - '.github/workflows/event-service.yml'

jobs:
  event-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_service_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_service_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: event-service
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_service_ci
      RUN_DATABASE_INTEGRATION: 'true'
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-that-is-at-least-32-characters
      GATEWAY_ASSERTION_SECRET: ci-only-gateway-assertion-secret-that-is-at-least-32-characters
      USER_SERVICE_INTERNAL_KEY: ci-only-user-service-internal-key-that-is-at-least-32-characters
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: event-service/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ../api-gateway
          npm ci --prefix ../user-service
      - name: Report dependency audit findings
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/event-service-npm-audit.json" || true
          node - "$RUNNER_TEMP/event-service-npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const totals = report.metadata?.vulnerabilities || {};
          console.log('npm audit totals:', JSON.stringify(totals));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const via = (item.via || []).map((entry) => typeof entry === 'string'
              ? entry
              : { title: entry.title, severity: entry.severity, range: entry.range, url: entry.url });
            console.log(JSON.stringify({
              name, severity: item.severity, isDirect: item.isDirect,
              range: item.range, fixAvailable: item.fixAvailable, via,
            }));
          }
          NODE
          npm audit --omit=dev --json > "$RUNNER_TEMP/event-service-production-audit.json" || true
          node - "$RUNNER_TEMP/event-service-production-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const totals = report.metadata?.vulnerabilities || {};
          console.log('production-only npm audit totals:', JSON.stringify(totals));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const via = (item.via || []).map((entry) => typeof entry === 'string' ? entry : entry.title);
            console.log(JSON.stringify({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable, via }));
          }
          NODE
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply PostgreSQL migrations
        run: npx prisma migrate deploy
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src test ../api-gateway/src ../shared ../user-service/src ../user-service/test -type f -name '*.js' -print)
      - name: Run Event Service unit and integration tests
        run: npm test
      - name: Run User Service internal authentication tests
        working-directory: .
        run: npm test --prefix user-service
      - name: Validate Docker Compose configuration
        working-directory: .
        env:
          GATEWAY_ASSERTION_SECRET: ci-only-gateway-secret-that-is-longer-than-32-characters
        run: docker compose config --quiet
      - name: Build Event Service image
        working-directory: .
        run: docker build -f event-service/Dockerfile -t ticketflow-event-service:ci .
