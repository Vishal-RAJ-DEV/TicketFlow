name: CodeQL

on:
  push:
    branches:
      - main
      - 'phase-2/**'
      - 'phase-2.1/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}/codeql-results
          post-processed-sarif-path: ${{ runner.temp }}/codeql-postprocessed
      - name: Report CodeQL findings with exact source locations
        if: always()
        run: node scripts/report-codeql-sarif.js "${{ runner.temp }}/codeql-postprocessed" "${{ steps.analyze.outputs.sarif-output }}"
